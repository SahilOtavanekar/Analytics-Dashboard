# Theme matched to demandai.net/insyte. Colour values are the site's own CSS
# custom properties (--t, --ink, --muted, --line), read off the live page.
#
# Chart colours here and the palette in src/theme.py must stay in step: these
# apply to charts that do not name their own colours, while our Altair builders
# pass explicit ones. Changing only this file leaves teal chrome around blue charts.
#
# Both [theme.light] and [theme.dark] are defined so the mode toggle stays
# available. The dark palette is re-selected against the dark surface, not flipped.

[theme]
# The site uses Inter. This fetch happens in the viewer's browser rather than
# Snowflake's container, so the lack of an External Access Integration should not
# block it - but Snowflake may apply a CSP that does. If it fails the browser
# falls back to its default sans, which is why src/theme.py keeps a system stack.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"

# The site rounds cards at 12-18px, against Streamlit's 4px default.
baseRadius = "large"
buttonRadius = "large"
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#056e6e"              # --t; 6.07:1 under the white button text
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f7f7"  # tinted toward --line, which is pure white on the site
textColor = "#0b1a1a"                 # --ink, 17.8:1
linkColor = "#056e6e"
borderColor = "#e6ecec"               # --line
dataframeBorderColor = "#e6ecec"
dataframeHeaderBackgroundColor = "#f2f7f7"
chartCategoricalColors = [
    "#1d9485", "#913797", "#a9881b", "#0d53af",
    "#c43d4d", "#41ba5d", "#7455c7", "#c66a19",
]
chartSequentialColors = [
    "#d9fefb", "#82fdf5", "#4dece4", "#3dd3cc", "#35bbb4",
    "#2da39d", "#258b86", "#1c716d", "#145855", "#0b3e3b",
]

[theme.light.sidebar]
backgroundColor = "#f7fafa"
secondaryBackgroundColor = "#eef4f4"
borderColor = "#e6ecec"
primaryColor = "#056e6e"

[theme.dark]
# Primary is a joint solve: white button text needs 4.5:1, and the button needs
# 3:1 against the surface. #056e6e satisfies the first and fails the second here,
# so the teal lifts one step - 4.91:1 under white text, 3.82:1 against #0c1313.
primaryColor = "#077e7a"
backgroundColor = "#0c1313"           # --ink pushed to a surface, not pure black
secondaryBackgroundColor = "#16211f"
textColor = "#e8f0ef"                 # 15.7:1
linkColor = "#4fd8c9"                 # 10.4:1; the accent aqua reads well here
borderColor = "#26332f"
dataframeBorderColor = "#26332f"
dataframeHeaderBackgroundColor = "#16211f"
chartCategoricalColors = [
    "#1baa9e", "#973d9d", "#a38213", "#145ec1",
    "#b93345", "#29a84c", "#7658cb", "#ae5b0f",
]
# Reversed: on a dark surface a sequential ramp has to run dark-to-light, or its
# low end disappears into the background.
chartSequentialColors = [
    "#0b3e3b", "#145855", "#1c716d", "#258b86", "#2da39d",
    "#35bbb4", "#3dd3cc", "#4dece4", "#82fdf5", "#d9fefb",
]

[theme.dark.sidebar]
backgroundColor = "#0a1010"
secondaryBackgroundColor = "#16211f"
borderColor = "#26332f"
primaryColor = "#077e7a"
